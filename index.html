<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Treino Tracker</title><style>:root{--bg:#f4f5f7;--card:#fff;--text:#17191d;--muted:#737984;--line:#e2e4e8;--dark:#111827;--green:#16803c;--soft:#eef0f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:500px;margin:auto;min-height:100vh;padding-bottom:88px}header{background:var(--dark);color:#fff;padding:22px 17px 18px;border-radius:0 0 25px 25px;padding-top:calc(22px + env(safe-area-inset-top))}.top,.row{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.sub{font-size:11px;opacity:.65;margin-top:3px}.week{display:flex;gap:5px;margin-top:17px}.day{flex:1;border:0;padding:7px 1px;border-radius:9px;background:#252d3c;color:#fff;font-size:9px}.day.active{background:#fff;color:#111827;font-weight:900}main{padding:15px}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:13px}.tabs button{min-width:62px;border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px;font-weight:850}.tabs .sel{background:var(--dark);color:#fff}.title{font-size:18px;font-weight:900}.muted{font-size:11px;color:var(--muted)}.badge{background:var(--soft);border-radius:999px;padding:6px 8px;font-size:10px;font-weight:850}.bar{height:7px;background:#e7e9ec;border-radius:8px;overflow:hidden;margin:8px 0 12px}.fill{height:100%;background:var(--green)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin:12px 0}.section{border-top:1px solid #eceef1;padding:12px 0}.section:first-child{border-top:0;padding-top:0}.section-title{font-weight:900;font-size:13px}.exercise{border-top:1px solid #eceef1;padding:14px 0}.exercise:first-child{border-top:0;padding-top:0}.exrow{display:flex;justify-content:space-between;gap:10px}.name{font-weight:850;font-size:14px}.meta{font-size:10px;color:#777;margin-top:3px}.intensity,.note{background:#f7f7f8;border-radius:10px;padding:9px;margin-top:8px;font-size:10px;line-height:1.45}.note{background:#fff8e6}.inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.inputs label{font-size:9px;color:#777}.inputs input{width:100%;margin-top:3px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px}.btn,.primary{border-radius:10px;padding:9px 11px;font-weight:800}.btn{border:1px solid #ddd;background:#fff}.green{background:var(--green);color:#fff;border-color:var(--green)}.primary{width:100%;border:0;background:var(--dark);color:#fff;font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f7f7f8;border-radius:12px;text-align:center;padding:12px}.num{font-size:20px;font-weight:900}.lbl{font-size:9px;color:#777}.history-item{padding:13px 0;border-top:1px solid #eee;cursor:pointer}.history-item:first-child{border-top:0}.empty{text-align:center;padding:25px;color:#777}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}nav button{border:0;background:none;color:#777;font-size:10px}nav button.on{color:#111;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:min(500px,100%);margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}.clock{font-size:64px;font-weight:900;text-align:center}.sheet input{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;margin:4px 0 10px}</style></head><body><div class="app"><header><div class="top"><div><div class="brand">Treino Tracker</div><div class="sub">V1.01 • Hipertrofia natural • até 40 min</div></div><span>🏋️</span></div><div id="week" class="week"></div></header><main id="main"></main><nav><button id="navTreino" onclick="showScreen('treino')">🏋️<br>Treino</button><button id="navHistorico" onclick="showScreen('historico')">📅<br>Histórico</button><button id="navProgresso" onclick="showScreen('progresso')">📈<br>Progresso</button><button id="navConfig" onclick="showScreen('config')">⚙️<br>Config.</button></nav></div><div class="modal" id="timerModal"><div class="sheet"><div class="title">Descanso</div><div class="clock" id="clock">90</div><button class="primary" onclick="closeTimer()">Encerrar</button></div></div><div class="modal" id="measureModal"><div class="sheet"><div class="title">Avaliação</div><label>Peso (kg)</label><input id="mWeight" type="number" step="0.1"><label>% gordura</label><input id="mFat" type="number" step="0.1"><label>Observação</label><input id="mNote"><button class="primary" onclick="saveMeasure()">Salvar</button></div></div><script>'use strict';
var workouts={QUARTA:{label:'QUARTA',title:'Peito + Tríceps',time:38,items:[['Supino inclinado máquina','3x10–12','grande',90],['Supino reto halteres','3x8–10','grande',90],['Crucifixo máquina','2x12–15','pequeno',60],['Paralelas assistidas / mergulho máquina','3x10','grande',90],['Tríceps corda','3x12','pequeno',60],['Tríceps unilateral polia','2x15','pequeno',60]]},QUINTA:{label:'QUINTA',title:'Costas + Bíceps',time:40,items:[['Puxada frente pegada aberta','3x10','grande',90],['Remada baixa triângulo','3x10','grande',90],['Remada articulada unilateral','3x12','grande',90],['Pulldown braço estendido','2x15','pequeno',60],['Rosca Scott máquina','3x10','pequeno',60],['Rosca martelo corda','2x12','pequeno',60]]},SEXTA:{label:'SEXTA',title:'Pernas',time:40,items:[['Leg Press','4x10','grande',90],['Mesa flexora','3x12','pequeno',60],['Cadeira extensora','3x12','pequeno',60],['Cadeira abdutora','2x15','pequeno',60],['Panturrilha sentado','4x15','pequeno',60]]},SÁBADO:{label:'SÁBADO',title:'Ombros + Trapézio + Core',time:38,items:[['Desenvolvimento na máquina','3x8–10','grande',90],['Elevação lateral na máquina','3x12–15','pequeno',60],['Remada com peito apoiado, cotovelos mais abertos','3x10–12','grande',90],['Elevação lateral unilateral na polia','2x12–15','pequeno',60],['Abdominal no cabo','3x12–15','core',60],['Prancha','2 séries','core',60]]},DOMINGO:{label:'DOMINGO',title:'Upper Hipertrofia',time:35,items:[['Supino inclinado','2x12','grande',90],['Remada baixa','2x12','grande',90],['Desenvolvimento','2x12','grande',90],['Rosca direta','2x12','pequeno',60],['Tríceps corda','2x12','pequeno',60],['Elevação lateral','2x15','pequeno',60]]}};
var data;try{data=JSON.parse(localStorage.getItem('tt100')||'{"sessions":{},"measurements":[]}')}catch(e){data={sessions:{},measurements:[]}}var selectedDay=getDay();var timerId=null,timerEnd=0,wakeLock=null;function el(id){return document.getElementById(id)}function save(){localStorage.setItem('tt100',JSON.stringify(data))}function getDay(){return ['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][new Date().getDay()]}function dateKey(d){return (d||new Date()).toISOString().slice(0,10)}function setCount(x){var m=/^(\d+)/.exec(x);return m?Number(m[1]):2}function target(x){var m=/(?:×|x)(\d+)(?:–|-)(\d+)/.exec(x);if(m)return Number(m[2]);m=/(?:×|x)(\d+)/.exec(x);return m?Number(m[1]):null}function session(day,date){var k=(date||dateKey())+'_'+day;if(!data.sessions[k])data.sessions[k]={finished:false,ex:{}};return data.sessions[k]}function state(day,i){var s=session(day),n=setCount(workouts[day].items[i][1]);if(!s.ex[i])s.ex[i]={sets:[]};while(s.ex[i].sets.length<n)s.ex[i].sets.push({done:false,reps:'',rpe:'',load:''});return s.ex[i]}
function renderWeek(){var names=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'],d=new Date(),h='';for(var n=-3;n<=3;n++){var x=new Date(d);x.setDate(d.getDate()+n);var full=['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][x.getDay()];h+='<button class="day '+(n===0?'active':'')+'" onclick="selectDay(\''+full+'\')">'+names[x.getDay()]+'<br>'+String(x.getDate()).padStart(2,'0')+'</button>'}el('week').innerHTML=h}
function previous(day){for(var n=1;n<=30;n++){var d=new Date();d.setDate(d.getDate()-n);var k=dateKey(d)+'_'+day;if(data.sessions[k]&&data.sessions[k].finished)return data.sessions[k]}return null}
function renderWorkout(){if(!workouts[selectedDay]){el('main').innerHTML='<div class="card"><div class="title">Descanso</div><div class="muted">Hoje não há treino programado.</div></div>';return}var w=workouts[selectedDay],total=0,done=0;w.items.forEach(function(e,i){total+=setCount(e[1]);done+=state(selectedDay,i).sets.filter(function(s){return s.done}).length});var pct=Math.round(done/total*100),h='<div class="tabs">';Object.keys(workouts).forEach(function(k){h+='<button class="'+(k===selectedDay?'sel':'')+'" onclick="selectDay(\''+k+'\')">'+workouts[k].label+'</button>'});h+='</div><div class="row"><div><div class="title">'+w.title+'</div><div class="muted">'+w.time+' min • hipertrofia</div></div><span class="badge">'+pct+'%</span></div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div><div class="card"><div class="section"><div class="section-title">🔥 Aquecimento</div><div class="muted">5 minutos: bicicleta ou esteira inclinada + 1 série leve do primeiro exercício.</div></div><div class="section"><div class="section-title">🎯 Intensidade</div><div class="intensity">Série 1 → <b>2 RIR</b> · Série 2 → <b>1 RIR</b> · Série 3 → <b>quase falha técnica</b>.</div></div><div class="section"><div class="section-title">⏱ Descanso</div><div class="muted">Grandes: <b>90 s</b> · Pequenos: <b>45–60 s</b>.</div></div></div><div class="card">';w.items.forEach(function(e,i){h+=exerciseHTML(e,i)});h+='</div><button class="primary" onclick="finishWorkout()">✓ Finalizar treino • '+done+'/'+total+' séries</button>';el('main').innerHTML=h}
function exerciseHTML(e,i){var s=state(selectedDay,i),p=previous(selectedDay),upper=target(e[1]),h='<div class="exercise"><div class="exrow"><div><div class="name">'+e[0]+'</div><div class="meta">'+e[1]+' • '+e[2]+' • descanso '+e[3]+' s</div></div><span class="badge">'+s.sets.filter(function(x){return x.done}).length+'/'+s.sets.length+'</span></div>';if(p&&p.ex&&p.ex[i]&&p.ex[i].sets)h+='<div class="muted" style="margin-top:6px">Sessão anterior: <b>'+p.ex[i].sets.map(function(x){return x.reps?(x.reps+' reps'+(x.load?' • '+x.load+' kg':'')):'—'}).join(' / ')+'</b></div>';if(upper&&s.sets.every(function(x){return x.done&&Number(x.reps)>=upper}))h+='<div class="note">⬆️ <b>Progressão:</b> atingiu '+upper+' reps em todas as séries. Aumente a carga na próxima sessão.</div>';s.sets.forEach(function(x,j){h+='<div style="margin-top:10px;padding:9px;background:#fafafa;border-radius:10px"><div class="row"><b style="font-size:11px">Série '+(j+1)+'/'+s.sets.length+'</b><span class="muted">'+(j===0?'2 RIR':j===1?'1 RIR':'quase falha')+'</span></div><div class="inputs"><label>Reps<input type="number" value="'+x.reps+'" placeholder="'+(upper||'—')+'" onchange="setSet('+i+','+j+',\'reps\',this.value)"></label><label>RPE<input type="number" min="1" max="10" value="'+x.rpe+'" onchange="setSet('+i+','+j+',\'rpe\',this.value)"></label><label>Carga<input value="'+x.load+'" placeholder="kg" onchange="setSet('+i+','+j+',\'load\',this.value)"></label></div><button class="btn '+(x.done?'green':'')+'" style="margin-top:8px;width:100%" onclick="toggleSet('+i+','+j+')">'+(x.done?'✓ Série concluída':'Marcar série concluída')+'</button></div>'});h+='<button class="btn" style="margin-top:8px" onclick="startTimer('+e[3]+')">⏱ '+e[3]+' s de descanso</button></div>';return h}
function selectDay(d){selectedDay=d;renderWeek();renderWorkout();showNav('treino')}function setSet(i,j,f,v){state(selectedDay,i).sets[j][f]=v;save()}function toggleSet(i,j){var s=state(selectedDay,i);s.sets[j].done=!s.sets[j].done;save();renderWorkout()}function finishWorkout(){var s=session(selectedDay);s.finished=true;s.finishedAt=new Date().toISOString();save();alert('Treino registrado com sucesso.');renderWorkout()}
function showNav(s){['treino','historico','progresso','config'].forEach(function(x){el('nav'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('on',x===s)})}function showScreen(s){showNav(s);if(s==='treino'){renderWeek();renderWorkout()}else if(s==='historico')renderHistory();else if(s==='progresso')renderProgress();else renderConfig()}
function renderHistory(){var a=Object.entries(data.sessions).filter(function(x){return x[1].finished}).sort(function(a,b){return (b[1].finishedAt||'').localeCompare(a[1].finishedAt||'')});var h='<div class="title">Histórico</div><div class="card">';if(!a.length)h+='<div class="empty">Nenhum treino finalizado ainda.</div>';a.forEach(function(x){var p=x[0].split('_');h+='<div class="history-item" onclick="historyDetail(\''+x[0]+'\')"><b>'+p[1]+'</b><div class="muted">'+new Date(p[0]+'T12:00:00').toLocaleDateString('pt-BR')+'</div>›</div>'});h+='</div>';el('main').innerHTML=h}function historyDetail(k){var p=k.split('_'),s=data.sessions[k],w=workouts[p[1]],h='<button class="btn" onclick="showScreen(\'historico\')">← Voltar</button><div class="title" style="margin-top:14px">'+w.title+'</div><div class="muted">'+new Date(p[0]+'T12:00:00').toLocaleDateString('pt-BR')+'</div><div class="card">';w.items.forEach(function(e,i){var sets=s.ex&&s.ex[i]?s.ex[i].sets:[];h+='<div class="history-item"><b>'+e[0]+'</b><div class="muted">'+sets.map(function(x,j){return 'S'+(j+1)+': '+(x.reps||'—')+' reps'+(x.load?' • '+x.load+' kg':'')+(x.rpe?' • RPE '+x.rpe:'')}).join('<br>')+'</div></div>'});h+='</div>';el('main').innerHTML=h}
function renderProgress(){var n=Object.values(data.sessions).filter(function(s){return s.finished}).length;el('main').innerHTML='<div class="title">Progresso</div><div class="card"><div class="grid2"><div class="stat"><div class="num">'+n+'</div><div class="lbl">TREINOS</div></div><div class="stat"><div class="num">'+data.measurements.length+'</div><div class="lbl">AVALIAÇÕES</div></div></div></div><div class="card"><b>Regra de progressão</b><div class="muted" style="margin-top:7px">Atingiu o topo da faixa em todas as séries com técnica? Aumente a carga na próxima sessão.</div></div>'}function renderConfig(){el('main').innerHTML='<div class="title">Configurações</div><div class="card"><b>Metas</b><div class="muted" style="line-height:1.7;margin-top:7px">Proteína: 130–140 g/dia<br>Água: 2,5–3 L/dia<br>Sono: 7h30–8h30<br>Cardio: 10 min leve</div></div><div class="card"><b>Dados</b><div class="muted" style="margin:7px 0">Registros salvos localmente neste aparelho.</div><button class="btn" onclick="exportData()">Exportar backup</button> <button class="btn" onclick="openMeasure()">Avaliação</button></div>'}function openMeasure(){el('measureModal').classList.add('show')}function saveMeasure(){data.measurements.push({date:dateKey(),weight:el('mWeight').value,fat:el('mFat').value,note:el('mNote').value});save();el('measureModal').classList.remove('show');renderProgress()}function exportData(){var b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='treino-tracker-backup.json';a.click()}
async function startTimer(sec){clearInterval(timerId);timerEnd=Date.now()+sec*1000;el('timerModal').classList.add('show');try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}updateTimer();timerId=setInterval(updateTimer,250)}function updateTimer(){var n=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));el('clock').textContent=n;if(n<=0){clearInterval(timerId);if(wakeLock){wakeLock.release().catch(function(){});wakeLock=null}if(navigator.vibrate)navigator.vibrate([200,100,200])}}function closeTimer(){clearInterval(timerId);if(wakeLock){wakeLock.release().catch(function(){});wakeLock=null}el('timerModal').classList.remove('show')}document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&timerEnd)updateTimer()});renderWeek();renderWorkout();showNav('treino');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
