<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Treino Tracker</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#17191d;--muted:#737984;--line:#e2e4e8;--dark:#111827;--green:#16803c;--soft:#eef0f3}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}.app{max-width:500px;margin:auto;min-height:100vh;padding-bottom:92px}
header{background:var(--dark);color:#fff;padding:22px 17px 18px;border-radius:0 0 25px 25px;padding-top:calc(22px + env(safe-area-inset-top))}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.sub{font-size:11px;opacity:.65;margin-top:3px}
.week{display:flex;gap:5px;margin-top:17px}.day{flex:1;text-align:center;padding:7px 1px;border-radius:9px;background:#252d3c;font-size:9px;color:#fff}.day.active{background:#fff;color:#111827;font-weight:900}
main{padding:15px}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:13px}.tabs button{min-width:62px;border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px;font-weight:850}.tabs .sel{background:var(--dark);color:#fff;border-color:var(--dark)}
.row{display:flex;justify-content:space-between;align-items:center}.title{font-size:18px;font-weight:900}.muted{font-size:11px;color:var(--muted)}.badge{background:var(--soft);border-radius:999px;padding:6px 8px;font-size:10px;font-weight:850}
.bar{height:7px;background:#e7e9ec;border-radius:8px;overflow:hidden;margin:8px 0 12px}.fill{height:100%;background:var(--green);width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #00000008}
.section{border-top:1px solid #eceef1;padding:12px 0}.section:first-child{border-top:0;padding-top:0}.section-title{font-weight:900;font-size:13px}
.exercise{border-top:1px solid #eceef1;padding:14px 0}.exercise:first-child{border-top:0;padding-top:0}.exrow{display:flex;justify-content:space-between;gap:10px}.name{font-weight:850;font-size:14px}.meta{font-size:10px;color:#777;margin-top:3px}
.intensity{background:#f7f7f8;border-radius:11px;padding:9px;margin-top:9px;font-size:10px;line-height:1.45}.rpe{display:flex;gap:4px;margin-top:6px}.rpe span{flex:1;text-align:center;padding:5px 2px;border-radius:6px;background:#e8eaed;font-size:9px}.rpe span.active{background:var(--dark);color:#fff}
.inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}.inputs label{font-size:9px;color:#777}.inputs input{width:100%;margin-top:3px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px}
.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 11px;font-weight:800}.primary{width:100%;border:0;border-radius:12px;padding:13px;background:var(--dark);color:#fff;font-weight:900;font-size:14px}.green{background:var(--green);color:#fff;border-color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f7f7f8;border-radius:12px;text-align:center;padding:12px}.num{font-size:20px;font-weight:900}.lbl{font-size:9px;color:#777;margin-top:2px}
.history-item{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #eee}.history-item:first-child{border-top:0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}nav button{border:0;background:none;color:#777;font-size:10px}nav .on{color:#111;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:min(500px,100%);margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}.clock{font-size:64px;font-weight:900;text-align:center}.sheet input,.sheet select{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;margin:4px 0 10px}.sheet .primary{margin-top:6px}
.note{padding:10px;background:#fff8e6;border-radius:10px;font-size:10px;line-height:1.5}.empty{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>
<div class="app"><header><div class="top"><div><div class="brand">Treino Tracker</div><div class="sub">V1.00 • Hipertrofia natural • até 40 min</div></div><span>🏋️</span></div><div class="week" id="week"></div></header><main id="main"></main>
<nav><button class="on" data-screen="treino" onclick="show('treino')">🏋️<br>Treino</button><button data-screen="historico" onclick="show('historico')">📅<br>Histórico</button><button data-screen="progresso" onclick="show('progresso')">📈<br>Progresso</button><button data-screen="config" onclick="show('config')">⚙️<br>Config.</button></nav></div>
<div class="modal" id="timerModal"><div class="sheet"><div class="title">Descanso</div><div class="clock" id="clock">90</div><div class="muted" style="text-align:center">Cronômetro da série</div><button class="primary" onclick="closeTimer()">Encerrar</button></div></div>
<div class="modal" id="measureModal"><div class="sheet"><div class="title">Avaliação de segunda-feira</div><div class="muted">Registre seus indicadores mensais/semanais.</div><label>Peso (kg)</label><input id="mWeight" type="number" step="0.1"><label>% de gordura</label><input id="mFat" type="number" step="0.1"><label>Observação</label><input id="mNote" type="text"><button class="primary" onclick="saveMeasure()">Salvar</button></div></div>
<script>
const workouts={
QUARTA:{label:"QUARTA",title:"Peito + Tríceps",time:38,items:[["Supino inclinado máquina","3x10–12","grande",90],["Supino reto halteres","3x8–10","grande",90],["Crucifixo máquina","2x12–15","pequeno",60],["Paralelas assistidas / mergulho máquina","3x10","grande",90],["Tríceps corda","3x12","pequeno",60],["Tríceps unilateral polia","2x15","pequeno",60]]},
QUINTA:{label:"QUINTA",title:"Costas + Bíceps",time:40,items:[["Puxada frente pegada aberta","3x10","grande",90],["Remada baixa triângulo","3x10","grande",90],["Remada articulada unilateral","3x12","grande",90],["Pulldown braço estendido","2x15","pequeno",60],["Rosca Scott máquina","3x10","pequeno",60],["Rosca martelo corda","2x12","pequeno",60]]},
SEXTA:{label:"SEXTA",title:"Pernas",time:40,items:[["Leg Press","4x10","grande",90],["Mesa flexora","3x12","pequeno",60],["Cadeira extensora","3x12","pequeno",60],["Cadeira abdutora","2x15","pequeno",60],["Panturrilha sentado","4x15","pequeno",60]]},
SÁBADO:{label:"SÁBADO",title:"Ombro + Trapézio + Core",time:38,items:[["Desenvolvimento máquina","3x10","grande",90],["Elevação lateral máquina","3x15","pequeno",60],["Crucifixo inverso","3x15","pequeno",60],["Face Pull","3x15","pequeno",60],["Prancha","3 séries","core",60],["Abdominal cabo","3x15","core",60]]},
DOMINGO:{label:"DOMINGO",title:"Upper Hipertrofia",time:35,items:[["Supino inclinado","2x12","grande",90],["Remada baixa","2x12","grande",90],["Desenvolvimento","2x12","grande",90],["Rosca direta","2x12","pequeno",60],["Tríceps corda","2x12","pequeno",60],["Elevação lateral","2x15","pequeno",60]]}};
let data=JSON.parse(localStorage.getItem("tt100")||'{"sessions":{},"measurements":[]}'),selectedDay=getDayKey(),timerId=null;
function save(){localStorage.setItem("tt100",JSON.stringify(data))} function dateKey(d=new Date()){return d.toISOString().slice(0,10)} function getDayKey(){return ["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"][new Date().getDay()]} function plannedKey(day){return ["QUARTA","QUINTA","SEXTA","SÁBADO","DOMINGO"].includes(day)} function sessionKey(day=selectedDay,date=dateKey()){return date+"_"+day} function session(day=selectedDay){let k=sessionKey(day);if(!data.sessions[k])data.sessions[k]={started:false,finished:false,ex:{}};return data.sessions[k]}
function setCount(e){let m=e.match(/^(\d+)/);return m?Number(m[1]):3} function targetUpper(e){let m=e.match(/(?:×|x)(\d+)(?:–|-)(\d+)/);if(m)return Number(m[2]);m=e.match(/(?:×|x)(\d+)/);return m?Number(m[1]):null}
function exState(day,i){let s=session(day),n=setCount(workouts[day].items[i][1]);if(!s.ex[i])s.ex[i]={sets:Array.from({length:n},()=>({done:false,reps:"",rpe:"",load:""}))};if(!s.ex[i].sets){s.ex[i]={sets:Array.from({length:n},(_,j)=>({done:j===0&&s.ex[i].done||false,reps:s.ex[i].reps||"",rpe:s.ex[i].rpe||"",load:s.ex[i].load||""}))}}while(s.ex[i].sets.length<n)s.ex[i].sets.push({done:false,reps:"",rpe:"",load:""});s.ex[i].sets=s.ex[i].sets.slice(0,n);return s.ex[i]}
function renderWeek(){let names=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"],d=new Date(),html="";for(let n=-3;n<=3;n++){let x=new Date(d);x.setDate(d.getDate()+n);let full=["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"][x.getDay()];html+=`<button class="day ${n===0?'active':''}" onclick="selectedDay='${full}';renderWorkout()">${names[x.getDay()]}<br>${String(x.getDate()).padStart(2,"0")}</button>`}document.getElementById("week").innerHTML=html}
function previousSession(day){for(let n=1;n<=21;n++){let d=new Date();d.setDate(d.getDate()-n);let k=d.toISOString().slice(0,10)+"_"+day;if(data.sessions[k]&&data.sessions[k].finished)return data.sessions[k]}return null}
function exerciseComplete(day,i){return exState(day,i).sets.every(x=>x.done)}
function renderWorkout(){if(!plannedKey(selectedDay)){document.getElementById("main").innerHTML=`<div class="card"><div class="title">Descanso</div><div class="muted" style="margin-top:5px">Hoje não há treino programado na ficha.</div><div class="note" style="margin-top:12px">📏 Segunda-feira: pesar, medir % de gordura e registrar fotos frente/costas/lado.</div></div>`;return}let w=workouts[selectedDay],totalSets=w.items.reduce((a,e)=>a+setCount(e[1]),0),completedSets=w.items.reduce((a,_,i)=>a+exState(selectedDay,i).sets.filter(x=>x.done).length,0),pct=Math.round(completedSets/totalSets*100);document.getElementById("main").innerHTML=`<div class="tabs">${Object.keys(workouts).map(k=>`<button class="${k===selectedDay?'sel':''}" onclick="selectedDay='${k}';renderWorkout()">${workouts[k].label}</button>`).join("")}</div><div class="row"><div><div class="title">${w.title}</div><div class="muted">${w.time} minutos • hipertrofia</div></div><span class="badge">${pct}%</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="card"><div class="section"><div class="section-title">🔥 Aquecimento</div><div class="muted" style="margin-top:5px">5 minutos: bicicleta ou esteira inclinada + 1 série leve do primeiro exercício.</div></div><div class="section"><div class="section-title">🎯 Intensidade</div><div class="intensity">Série 1 → <b>2 RIR</b> · Série 2 → <b>1 RIR</b> · Série 3 → <b>praticamente falha técnica</b>.<br>Não sacrificar técnica para completar repetições.</div></div><div class="section"><div class="section-title">⏱ Descanso</div><div class="muted" style="margin-top:5px">Grandes: <b>90 s</b> · Pequenos: <b>45–60 s</b>. O botão de cada exercício usa o descanso configurado.</div></div></div><div class="card">${w.items.map((e,i)=>exerciseHTML(e,i)).join("")}</div><button class="primary" onclick="finishWorkout()">✓ Finalizar treino • ${completedSets}/${totalSets} séries</button><div class="h2" style="margin-top:20px">Regras da ficha</div><div class="card"><div class="muted" style="line-height:1.6">❌ Sem banco romano<br>❌ Sem extensão lombar<br>⚠️ Evitar provocar a cervical; priorizar controle e técnica.</div></div><div class="h2" style="margin-top:20px">Cardio pós-treino</div><div class="card"><div class="muted">10 minutos de bicicleta ou caminhada inclinada. Intensidade leve.</div></div>`}
function exerciseHTML(e,i){let s=exState(selectedDay,i),n=s.sets.length,upper=targetUpper(e[1]),prev=previousSession(selectedDay),rirLabels=["2 RIR","1 RIR","quase falha técnica"],prevText="";if(prev&&prev.ex&&prev.ex[i]&&prev.ex[i].sets){let vals=prev.ex[i].sets.map(x=>x.reps?`${x.reps} reps${x.load?" • "+x.load+" kg":""}`:"—");prevText=`<div class="muted" style="margin-top:6px">Sessão anterior: <b>${vals.join(" / ")}</b></div>`}let allUpper=upper&&s.sets.every(x=>Number(x.reps)>=upper&&x.done),suggestion=allUpper?`<div class="note" style="margin-top:8px">⬆️ <b>Progressão:</b> você atingiu ${upper} reps em todas as séries. Aumente a carga na próxima sessão, mantendo a técnica.</div>`:"";return `<div class="exercise"><div class="exrow"><div><div class="name">${e[0]}</div><div class="meta">${e[1]} • ${e[2]} • descanso ${e[3]} s</div></div><span class="badge">${exerciseComplete(selectedDay,i)?'✓ concluído':n+' séries'}</span></div>${prevText}${suggestion}${s.sets.map((set,j)=>`<div style="margin-top:10px;padding:9px;background:#fafafa;border-radius:10px"><div class="row"><b style="font-size:11px">Série ${j+1}/${n}</b><span class="muted">${rirLabels[Math.min(j,2)]}</span></div><div class="inputs"><label>Reps<input type="number" value="${set.reps}" placeholder="${upper||'—'}" onchange="setSet(${i},${j},'reps',this.value)"></label><label>RPE<input type="number" min="1" max="10" value="${set.rpe}" placeholder="—" onchange="setSet(${i},${j},'rpe',this.value)"></label><label>Carga<input type="text" value="${set.load}" placeholder="kg" onchange="setSet(${i},${j},'load',this.value)"></label></div><button class="btn ${set.done?'green':''}" style="margin-top:8px;width:100%" onclick="toggleSet(${i},${j})">${set.done?'✓ Série concluída':'Marcar série concluída'}</button></div>`).join("")}<button class="btn" style="margin-top:8px" onclick="startTimer(${e[3]})">⏱ ${e[3]} s de descanso</button></div>`}
function toggleSet(i,j){let s=exState(selectedDay,i);s.sets[j].done=!s.sets[j].done;save();renderWorkout()} function setSet(i,j,f,v){exState(selectedDay,i).sets[j][f]=v;save()} function toggleDone(i){let s=exState(selectedDay,i),v=!exerciseComplete(selectedDay,i);s.sets.forEach(x=>x.done=v);save();renderWorkout()}
function finishWorkout(){let s=session(selectedDay);s.finished=true;s.finishedAt=new Date().toISOString();save();alert("Treino registrado com sucesso.");renderWorkout()}
function startTimer(sec){let n=sec;document.getElementById("clock").textContent=n;document.getElementById("timerModal").classList.add("show");clearInterval(timerId);timerId=setInterval(()=>{n--;document.getElementById("clock").textContent=n;if(n<=0)clearInterval(timerId)},1000)} function closeTimer(){clearInterval(timerId);document.getElementById("timerModal").classList.remove("show")}
function show(s){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.screen===s));if(s==="treino"){renderWeek();renderWorkout();return}if(s==="historico"){renderHistory();return}if(s==="progresso"){renderProgress();return}renderConfig()}
function renderHistory(){let items=Object.entries(data.sessions).filter(([k,v])=>v.finished).sort((a,b)=>b[1].finishedAt.localeCompare(a[1].finishedAt));document.getElementById("main").innerHTML=`<div class="title">Histórico</div><div class="card">${items.length?items.map(([k,v])=>{let [dt,day]=k.split("_");return `<div class="history-item"><div><b>${day}</b><div class="muted">${new Date(dt+"T12:00:00").toLocaleDateString("pt-BR")}</div></div><b>✓ concluído</b></div>`}).join(""):`<div class="empty">Nenhum treino finalizado ainda.</div>`}</div>`}
function renderProgress(){let finished=Object.values(data.sessions).filter(s=>s.finished).length,measures=data.measurements,last=measures.at(-1);document.getElementById("main").innerHTML=`<div class="title">Progresso</div><div class="card"><div class="grid2"><div class="stat"><div class="num">${finished}</div><div class="lbl">TREINOS CONCLUÍDOS</div></div><div class="stat"><div class="num">${measures.length}</div><div class="lbl">AVALIAÇÕES</div></div></div></div><div class="card"><div class="section-title">📏 Última avaliação</div><div class="muted" style="margin-top:7px">${last?`Peso: <b>${last.weight||"—"} kg</b> · Gordura: <b>${last.fat||"—"}%</b>`:"Nenhuma avaliação registrada."}</div></div><button class="primary" onclick="openMeasure()">+ Registrar avaliação</button><div class="card" style="margin-top:12px"><div class="section-title">📈 Regra de progressão</div><div class="muted" style="margin-top:7px">Quando atingir <b>12 / 12 / 12</b> com técnica e dentro do alvo, aumentar a carga. Não aumentar antes.</div></div>`}
function openMeasure(){document.getElementById("measureModal").classList.add("show")} function saveMeasure(){data.measurements.push({date:dateKey(),weight:document.getElementById("mWeight").value,fat:document.getElementById("mFat").value,note:document.getElementById("mNote").value});save();document.getElementById("measureModal").classList.remove("show");show("progresso")}
function renderConfig(){document.getElementById("main").innerHTML=`<div class="title">Configurações</div><div class="card"><div class="section-title">🎯 Metas da ficha</div><div class="muted" style="line-height:1.7;margin-top:7px">Proteína: <b>130–140 g/dia</b><br>Água: <b>2,5–3 L/dia</b><br>Sono: <b>7h30–8h30</b><br>Cardio pós-treino: <b>10 min leve</b></div></div><div class="card"><div class="section-title">📅 Avaliação</div><div class="muted" style="margin-top:7px">Toda segunda-feira: peso, % gordura e fotos frente/costas/lado. Ajuste da ficha a cada 30 dias.</div><button class="btn" style="margin-top:10px" onclick="openMeasure()">Registrar avaliação</button></div><div class="card"><div class="section-title">💾 Dados</div><div class="muted" style="margin:7px 0">Os registros da V1.00 ficam armazenados localmente neste aparelho/navegador.</div><button class="btn" onclick="exportData()">Exportar backup</button> <button class="btn" onclick="clearData()">Apagar dados</button></div>`}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="treino-tracker-backup.json";a.click()} function clearData(){if(confirm("Apagar todos os registros deste aparelho?")){localStorage.removeItem("tt100");location.reload()}}
renderWeek();renderWorkout();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
