<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Treino Tracker</title><style>:root{--bg:#f4f5f7;--card:#fff;--text:#17191d;--muted:#737984;--line:#e2e4e8;--dark:#111827;--green:#16803c;--soft:#eef0f3}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.app{max-width:500px;margin:auto;min-height:100vh;padding-bottom:92px}header{background:var(--dark);color:#fff;padding:22px 17px 18px;border-radius:0 0 25px 25px;padding-top:calc(22px + env(safe-area-inset-top))}.top,.row{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.sub{font-size:11px;opacity:.65;margin-top:3px}.week{display:flex;gap:5px;margin-top:17px}.day{flex:1;border:0;text-align:center;padding:7px 1px;border-radius:9px;background:#252d3c;color:#fff;font-size:9px}.day.active{background:#fff;color:#111827;font-weight:900}main{padding:15px}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:13px}.tabs button{min-width:62px;border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px;font-weight:850}.tabs .sel{background:var(--dark);color:#fff}.title{font-size:18px;font-weight:900}.muted{font-size:11px;color:var(--muted)}.badge{background:var(--soft);border-radius:999px;padding:6px 8px;font-size:10px;font-weight:850}.bar{height:7px;background:#e7e9ec;border-radius:8px;overflow:hidden;margin:8px 0 12px}.fill{height:100%;background:var(--green)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #00000008}.section{border-top:1px solid #eceef1;padding:12px 0}.section:first-child{border-top:0;padding-top:0}.section-title{font-weight:900;font-size:13px}.exercise{border-top:1px solid #eceef1;padding:14px 0}.exercise:first-child{border-top:0;padding-top:0}.exrow{display:flex;justify-content:space-between;gap:10px}.name{font-weight:850;font-size:14px}.meta{font-size:10px;color:#777;margin-top:3px}.intensity{background:#f7f7f8;border-radius:11px;padding:9px;margin-top:9px;font-size:10px;line-height:1.45}.inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}.inputs label{font-size:9px;color:#777}.inputs input{width:100%;margin-top:3px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 11px;font-weight:800}.primary{width:100%;border:0;border-radius:12px;padding:13px;background:var(--dark);color:#fff;font-weight:900;font-size:14px}.green{background:var(--green);color:#fff;border-color:var(--green)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f7f7f8;border-radius:12px;text-align:center;padding:12px}.num{font-size:20px;font-weight:900}.lbl{font-size:9px;color:#777;margin-top:2px}.history-item{padding:13px 0;border-top:1px solid #eee;cursor:pointer}.history-item:first-child{border-top:0}.note{padding:10px;background:#fff8e6;border-radius:10px;font-size:10px;line-height:1.5}.empty{text-align:center;padding:25px;color:#777}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}nav button{border:0;background:none;color:#777;font-size:10px}nav .on{color:#111;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:min(500px,100%);margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}.clock{font-size:64px;font-weight:900;text-align:center}.sheet input{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;margin:4px 0 10px}</style></head><body><div class="app"><header><div class="top"><div><div class="brand">Treino Tracker</div><div class="sub">V1.00 • Hipertrofia natural • até 40 min</div></div><span>🏋️</span></div><div id="week" class="week"></div></header><main id="main"></main><nav><button class="on" data-screen="treino" onclick="show('treino')">🏋️<br>Treino</button><button data-screen="historico" onclick="show('historico')">📅<br>Histórico</button><button data-screen="progresso" onclick="show('progresso')">📈<br>Progresso</button><button data-screen="config" onclick="show('config')">⚙️<br>Config.</button></nav></div><div class="modal" id="timerModal"><div class="sheet"><div class="title">Descanso</div><div class="clock" id="clock">90</div><div class="muted" style="text-align:center">Contagem pelo horário real.</div><button class="primary" style="margin-top:12px" onclick="closeTimer()">Encerrar</button></div></div><div class="modal" id="measureModal"><div class="sheet"><div class="title">Avaliação</div><label>Peso (kg)</label><input id="mWeight" type="number" step="0.1"><label>% gordura</label><input id="mFat" type="number" step="0.1"><label>Observação</label><input id="mNote"><button class="primary" onclick="saveMeasure()">Salvar</button></div></div><script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)};var main=$('main'),week=$('week'),timerModal=$('timerModal'),clock=$('clock'),measureModal=$('measureModal');
var workouts={QUARTA:{label:'QUARTA',title:'Peito + Tríceps',time:38,items:[['Supino inclinado máquina','3x10–12','grande',90],['Supino reto halteres','3x8–10','grande',90],['Crucifixo máquina','2x12–15','pequeno',60],['Paralelas assistidas / mergulho máquina','3x10','grande',90],['Tríceps corda','3x12','pequeno',60],['Tríceps unilateral polia','2x15','pequeno',60]]},QUINTA:{label:'QUINTA',title:'Costas + Bíceps',time:40,items:[['Puxada frente pegada aberta','3x10','grande',90],['Remada baixa triângulo','3x10','grande',90],['Remada articulada unilateral','3x12','grande',90],['Pulldown braço estendido','2x15','pequeno',60],['Rosca Scott máquina','3x10','pequeno',60],['Rosca martelo corda','2x12','pequeno',60]]},SEXTA:{label:'SEXTA',title:'Pernas',time:40,items:[['Leg Press','4x10','grande',90],['Mesa flexora','3x12','pequeno',60],['Cadeira extensora','3x12','pequeno',60],['Cadeira abdutora','2x15','pequeno',60],['Panturrilha sentado','4x15','pequeno',60]]},SÁBADO:{label:'SÁBADO',title:'Ombro + Trapézio + Core',time:38,items:[['Desenvolvimento máquina','3x10','grande',90],['Elevação lateral máquina','3x15','pequeno',60],['Crucifixo inverso','3x15','pequeno',60],['Face Pull','3x15','pequeno',60],['Prancha','3 séries','core',60],['Abdominal cabo','3x15','core',60]]},DOMINGO:{label:'DOMINGO',title:'Upper Hipertrofia',time:35,items:[['Supino inclinado','2x12','grande',90],['Remada baixa','2x12','grande',90],['Desenvolvimento','2x12','grande',90],['Rosca direta','2x12','pequeno',60],['Tríceps corda','2x12','pequeno',60],['Elevação lateral','2x15','pequeno',60]]}};
var data;try{data=JSON.parse(localStorage.getItem('tt100')||'{"sessions":{},"measurements":[]}')}catch(e){data={sessions:{},measurements:[]};}var selectedDay=getDay();var timerId=null,timerEnd=0;
function save(){localStorage.setItem('tt100',JSON.stringify(data))}function getDay(){return ['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][new Date().getDay()]}function dateKey(){return new Date().toISOString().slice(0,10)}function planned(d){return !!workouts[d]}function session(d,date){var k=(date||dateKey())+'_'+d;if(!data.sessions[k])data.sessions[k]={finished:false,ex:{}};return data.sessions[k]}function setCount(x){var m=/^(\d+)/.exec(x);return m?Number(m[1]):3}function target(x){var m=/(?:×|x)(\d+)(?:–|-)(\d+)/.exec(x);if(m)return Number(m[2]);m=/(?:×|x)(\d+)/.exec(x);return m?Number(m[1]):null}
function exState(d,i){var s=session(d),n=setCount(workouts[d].items[i][1]);if(!s.ex[i])s.ex[i]={sets:[]};while(s.ex[i].sets.length<n)s.ex[i].sets.push({done:false,reps:'',rpe:'',load:''});if(s.ex[i].sets.length>n)s.ex[i].sets=s.ex[i].sets.slice(0,n);return s.ex[i]}
function renderWeek(){var names=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'],d=new Date(),h='';for(var n=-3;n<=3;n++){var x=new Date(d);x.setDate(d.getDate()+n);var full=['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][x.getDay()];h+='<button class="day '+(n===0?'active':'')+'" onclick="TT.selectDay(\''+full+'\')">'+names[x.getDay()]+'<br>'+String(x.getDate()).padStart(2,'0')+'</button>'}week.innerHTML=h}
function previous(d){for(var n=1;n<=30;n++){var x=new Date();x.setDate(x.getDate()-n);var k=x.toISOString().slice(0,10)+'_'+d;if(data.sessions[k]&&data.sessions[k].finished)return data.sessions[k]}return null}
function renderWorkout(){if(!planned(selectedDay)){main.innerHTML='<div class="card"><div class="title">Descanso</div><div class="muted">Hoje não há treino programado.</div></div>';return}var w=workouts[selectedDay],total=0,done=0;w.items.forEach(function(e,i){total+=setCount(e[1]);done+=exState(selectedDay,i).sets.filter(function(s){return s.done}).length});var pct=Math.round(done/total*100);var html='<div class="tabs">';Object.keys(workouts).forEach(function(k){html+='<button class="'+(k===selectedDay?'sel':'')+'" onclick="TT.selectDay(\''+k+'\')">'+workouts[k].label+'</button>'});html+='</div><div class="row"><div><div class="title">'+w.title+'</div><div class="muted">'+w.time+' min • hipertrofia</div></div><span class="badge">'+pct+'%</span></div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div><div class="card"><div class="section"><div class="section-title">🔥 Aquecimento</div><div class="muted">5 minutos: bicicleta ou esteira inclinada + 1 série leve do primeiro exercício.</div></div><div class="section"><div class="section-title">🎯 Intensidade</div><div class="intensity">Série 1 → <b>2 RIR</b> · Série 2 → <b>1 RIR</b> · Série 3 → <b>quase falha técnica</b>.</div></div><div class="section"><div class="section-title">⏱ Descanso</div><div class="muted">Grandes: <b>90 s</b> · Pequenos: <b>45–60 s</b>.</div></div></div><div class="card">';w.items.forEach(function(e,i){html+=exerciseHTML(e,i)});html+='</div><button class="primary" onclick="TT.finish()">✓ Finalizar treino • '+done+'/'+total+' séries</button><div class="card"><div class="muted">❌ Sem banco romano<br>❌ Sem extensão lombar<br>⚠️ Priorizar controle e técnica.<br><br>Cardio pós-treino: <b>10 min</b> leve.</div></div>';main.innerHTML=html}
function exerciseHTML(e,i){var s=exState(selectedDay,i),prev=previous(selectedDay),upper=target(e[1]),h='<div class="exercise"><div class="exrow"><div><div class="name">'+e[0]+'</div><div class="meta">'+e[1]+' • '+e[2]+' • '+e[3]+' s</div></div><span class="badge">'+s.sets.filter(function(x){return x.done}).length+'/'+s.sets.length+'</span></div>';if(prev&&prev.ex&&prev.ex[i]&&prev.ex[i].sets)h+='<div class="muted" style="margin-top:6px">Anterior: <b>'+prev.ex[i].sets.map(function(x){return x.reps?(x.reps+' reps'+(x.load?' • '+x.load+' kg':'')):'—'}).join(' / ')+'</b></div>';if(upper&&s.sets.every(function(x){return x.done&&Number(x.reps)>=upper}))h+='<div class="note" style="margin-top:8px">⬆️ <b>Progressão:</b> bateu '+upper+' reps em todas as séries. Aumente a carga na próxima sessão.</div>';s.sets.forEach(function(set,j){h+='<div style="margin-top:10px;padding:9px;background:#fafafa;border-radius:10px"><div class="row"><b style="font-size:11px">Série '+(j+1)+'/'+s.sets.length+'</b><span class="muted">'+(j===0?'2 RIR':j===1?'1 RIR':'quase falha')+'</span></div><div class="inputs"><label>Reps<input type="number" value="'+set.reps+'" placeholder="'+(upper||'—')+'" onchange="TT.setSet('+i+','+j+',\'reps\',this.value)"></label><label>RPE<input type="number" min="1" max="10" value="'+set.rpe+'" onchange="TT.setSet('+i+','+j+',\'rpe\',this.value)"></label><label>Carga<input value="'+set.load+'" placeholder="kg" onchange="TT.setSet('+i+','+j+',\'load\',this.value)"></label></div><button class="btn '+(set.done?'green':'')+'" style="margin-top:8px;width:100%" onclick="TT.toggleSet('+i+','+j+')">'+(set.done?'✓ Série concluída':'Marcar série concluída')+'</button></div>'});h+='<button class="btn" style="margin-top:8px" onclick="TT.timer('+e[3]+')">⏱ '+e[3]+' s de descanso</button></div>';return h}
function finish(){session(selectedDay).finished=true;session(selectedDay).finishedAt=new Date().toISOString();save();alert('Treino registrado com sucesso.');renderWorkout()}function renderHistory(){var items=Object.keys(data.sessions).filter(function(k){return data.sessions[k].finished}).sort(function(a,b){return data.sessions[b].finishedAt.localeCompare(data.sessions[a].finishedAt)});var h='<div class="title">Histórico</div><div class="card">';if(!items.length)h+='<div class="empty">Nenhum treino finalizado ainda.</div>';items.forEach(function(k){var p=k.split('_');h+='<div class="history-item" onclick="TT.historyDetail(\''+k+'\')"><b>'+p[1]+'</b><div class="muted">'+new Date(p[0]+'T12:00:00').toLocaleDateString('pt-BR')+'</div>›</div>'});h+='</div>';main.innerHTML=h}
function historyDetail(k){var p=k.split('_'),s=data.sessions[k],w=workouts[p[1]],h='<button class="btn" onclick="TT.history()">← Voltar</button><div class="title" style="margin-top:14px">'+w.title+'</div><div class="muted">'+new Date(p[0]+'T12:00:00').toLocaleDateString('pt-BR')+'</div><div class="card">';w.items.forEach(function(e,i){var sets=s.ex&&s.ex[i]?s.ex[i].sets:[];h+='<div class="history-item"><b>'+e[0]+'</b><div class="muted">'+sets.map(function(z,j){return 'S'+(j+1)+': '+(z.reps||'—')+' reps'+(z.load?' • '+z.load+' kg':'')+(z.rpe?' • RPE '+z.rpe:'')}).join('<br>')+'</div></div>'});h+='</div>';main.innerHTML=h}
function progress(){var f=Object.keys(data.sessions).filter(function(k){return data.sessions[k].finished}).length;var last=data.measurements.length?data.measurements[data.measurements.length-1]:null;main.innerHTML='<div class="title">Progresso</div><div class="card"><div class="grid2"><div class="stat"><div class="num">'+f+'</div><div class="lbl">TREINOS</div></div><div class="stat"><div class="num">'+data.measurements.length+'</div><div class="lbl">AVALIAÇÕES</div></div></div></div><div class="card"><b>Última avaliação</b><div class="muted" style="margin-top:7px">'+(last?'Peso: '+(last.weight||'—')+' kg • Gordura: '+(last.fat||'—')+'%':'Nenhuma avaliação registrada.')+'</div></div><button class="primary" onclick="TT.openMeasure()">+ Registrar avaliação</button>'}function config(){main.innerHTML='<div class="title">Configurações</div><div class="card"><b>Metas</b><div class="muted" style="line-height:1.7;margin-top:7px">Proteína: <b>130–140 g/dia</b><br>Água: <b>2,5–3 L/dia</b><br>Sono: <b>7h30–8h30</b><br>Cardio: <b>10 min leve</b></div></div><div class="card"><b>Dados</b><div class="muted" style="margin:7px 0">Registros salvos localmente neste aparelho.</div><button class="btn" onclick="TT.exportData()">Exportar backup</button> <button class="btn" onclick="TT.clearData()">Apagar dados</button></div>'}
function show(s){document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-screen')===s)});if(s==='treino'){renderWeek();renderWorkout()}else if(s==='historico')renderHistory();else if(s==='progresso')progress();else config()}
async function timer(sec){clearInterval(timerId);timerEnd=Date.now()+sec*1000;timerModal.classList.add('show');try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}updateTimer();timerId=setInterval(updateTimer,250)}function updateTimer(){var left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));clock.textContent=left;if(left<=0){clearInterval(timerId);if(navigator.vibrate)navigator.vibrate([200,100,200])}}function closeTimer(){clearInterval(timerId);timerModal.classList.remove('show')}function setSet(i,j,f,v){exState(selectedDay,i).sets[j][f]=v;save()}function toggleSet(i,j){var s=exState(selectedDay,i);s.sets[j].done=!s.sets[j].done;save();renderWorkout()}function openMeasure(){measureModal.classList.add('show')}function saveMeasure(){data.measurements.push({date:dateKey(),weight:$('mWeight').value,fat:$('mFat').value,note:$('mNote').value});save();measureModal.classList.remove('show');progress()}function exportData(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='treino-tracker-backup.json';a.click()}function clearData(){if(confirm('Apagar todos os registros deste aparelho?')){localStorage.removeItem('tt100');location.reload()}}
window.TT={selectDay:function(d){selectedDay=d;renderWeek();renderWorkout()},finish:finish,history:renderHistory,historyDetail:historyDetail,show:show,timer:timer,setSet:setSet,toggleSet:toggleSet,openMeasure:openMeasure,exportData:exportData,clearData:clearData};
window.addEventListener('online',function(){location.reload()});renderWeek();renderWorkout();})();</script></body></html>
